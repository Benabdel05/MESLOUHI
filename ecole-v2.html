<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MESLOUHI School</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#161a33;--mu:#6b7194;--ac:#0047ab;--ac2:#1d70e0;--bd:#e6e8f4;--ok:#0f9d6b;--wa:#c27803;--er:#dc3b4b;--sh:0 1px 2px rgba(22,26,51,.04),0 8px 24px rgba(0,71,171,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--card:#171a30;--tx:#eceefc;--mu:#9aa0c7;--ac:#3b82f6;--ac2:#2563eb;--bd:#262a4a;--ok:#34d399;--wa:#fbbf24;--er:#fb7185;--sh:0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1020;--card:#171a30;--tx:#eceefc;--mu:#9aa0c7;--ac:#3b82f6;--ac2:#2563eb;--bd:#262a4a;--ok:#34d399;--wa:#fbbf24;--er:#fb7185;--sh:0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif}
header{background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;max-width:1050px;margin:auto}
.logo{font-weight:800;font-size:17px;margin-right:auto}
.lg{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-style:normal;margin-right:10px;vertical-align:middle}
#who{display:flex;align-items:center;gap:8px;font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:inline-grid;place-items:center;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1050px;margin:auto;padding:0 12px 10px}
nav button{white-space:nowrap;border-radius:99px;border-color:transparent;background:transparent;color:var(--mu)}
nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 12px rgba(0,71,171,.3)}
main{max-width:1050px;margin:auto;padding:16px;animation:up .3s ease}@keyframes up{from{opacity:0;transform:translateY(8px)}}
h2{margin:4px 0 14px;font-size:24px}h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:10px}
button.p,button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
button.ok{color:var(--ok);border-color:var(--ok)}button.er{color:var(--er);border-color:var(--er)}button:disabled{opacity:.4}
textarea{min-height:70px;resize:vertical}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0 10px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
label{font-size:13px;color:var(--mu);font-weight:600}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,currentColor 11%,transparent)}
.t-ok{color:var(--ok)}.t-wa{color:var(--wa)}.t-er{color:var(--er)}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;margin-bottom:12px}table{border-collapse:collapse;width:100%;min-width:600px}th,td{border:1px solid var(--bd);padding:7px;font-size:13px;vertical-align:top;text-align:left}th{font-size:11px;text-transform:uppercase;color:var(--mu)}
td.c{cursor:pointer}td.c:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.cell{--cc:var(--ac);background:color-mix(in srgb,var(--cc) 14%,transparent);border-left:3px solid var(--cc);border-radius:8px;padding:5px 7px}.c1{--cc:#0f9d6b}.c2{--cc:#e0802b}.c3{--cc:#d6409f}
.stat{font-size:34px;font-weight:800;line-height:1.2;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mt{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.mt i{display:block;height:100%}
.hero{background:linear-gradient(135deg,#003a8c,#0047ab 55%,#2f7bea);color:#fff;border-radius:24px;padding:40px 28px;margin-bottom:14px}.hero h2{font-size:clamp(26px,6vw,40px);line-height:1.15}.hero p{max-width:520px}
.hero button:not(.p){background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:9;max-width:90%}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
.demo button{margin:3px 4px 3px 0;font-size:13px}
.lgi{width:42px;height:42px;object-fit:contain;margin-right:10px;vertical-align:middle}
.hero{position:relative;overflow:hidden}.hl{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:150px;height:150px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.lgl{display:block;width:96px;height:96px;margin:0 auto 6px}
@media(max-width:700px){.hl{display:none}}
pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;color:var(--mu)}details summary{cursor:pointer}ul{margin:6px 0 0;padding-left:20px}
.bar{max-width:1300px}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1300px;margin:auto;align-items:start}
nav{position:sticky;top:calc(66px + env(safe-area-inset-top,0px));flex-direction:column;overflow:visible;max-width:none;margin:0;padding:18px 12px;gap:4px;border-right:1px solid var(--bd);min-height:calc(100vh - 80px)}
nav button{width:100%;text-align:left;border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
nav button:hover{background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--tx)}
nav button.on:hover{color:#fff}
main{max-width:none;margin:0;min-width:0;padding:20px 22px}
.cv{width:100%;height:150px;display:block;object-fit:cover}.cv.big{height:230px}.fc{padding:0!important;overflow:hidden}.fb{padding:14px 16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media(max-width:820px){.shell{grid-template-columns:1fr}nav{position:static;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);min-height:0;padding:8px 12px}nav button{width:auto;white-space:nowrap}main{padding:14px}}
</style></head><body>

<main id="app"></main></div><footer>© 2026 MESLOUHI School · Prototype de démonstration</footer><div id="toast"></div>

planning:()=>{if(!DB.grp.length)return '<h2>Emplois du temps</h2><div class="card"><p class="mu">Créez d’abord un groupe dans l’onglet « Groupes ».</p></div>';const e=S.ed,F=U.filter(x=>x.r==="formateur"&&x.v&&x.a);if(!DB.grp.some(g=>g.id===S.pg))S.pg=DB.grp[0].id;return `<h2>Emplois du temps</h2><div class="card"><label>Groupe</label><select onchange="S.pg=+this.value;S.ed=null;render()">${DB.grp.map(g=>`<option value="${g.id}" ${g.id===S.pg?"selected":""}>${E(g.n)} · ${fn(g.f)}</option>`).join("")}</select><p class="mu">Chaque groupe a son propre emploi du temps. Cliquez sur une case vide pour ajouter une séance, sur une séance pour la modifier ou la supprimer.</p>${grid(DB.sea.filter(s=>s.g===S.pg),1)}</div>`+(e?`<div class="card"><h3>${e.id?"Modifier":"Nouvelle"} séance</h3><div class="grid"><div><label>Jour</label><select id="sj">${JOURS.map((j,i)=>`<option value="${i}" ${e.j===i?"selected":""}>${j}</option>`).join("")}</select></div><div><label>Créneau</label><select id="ss">${HEURES.map((h,i)=>`<option value="${i}" ${e.s===i?"selected":""}>${h}</option>`).join("")}</select></div><div><label>Matière</label><input id="sm" value="${E(e.mat)}"></div><div><label>Salle</label><input id="sa" value="${E(e.sa)}"></div><div><label>Groupe</label><input value="${gn(S.pg)}" disabled></div><div><label>Formateur affecté</label><select id="sf"><option value="0">— aucun —</option>${F.map(f=>`<option value="${f.id}" ${e.f===f.id?"selected":""}>${E(f.n)}</option>`).join("")}</select></div></div><button class="p" onclick="saveS()">Enregistrer</button> ${e.id?`<button class="er" onclick="delS()">Supprimer</button> `:""}<button onclick="S.ed=null;render()">Annuler</button></div>`:"")},
users:()=>{const f=S.uf;return `<h2>Utilisateurs</h2><div class="card"><h3>${f&&f.id?"Modifier l’utilisateur":"Nouvel utilisateur"}</h3><div class="grid"><div><label>Nom</label><input id="un" value="${E(f&&f.n)}"></div><div><label>Email / identifiant</label><input id="ue" value="${E(f&&f.e)}"></div><div><label>Rôle</label><select id="ur">${["stagiaire","formateur","admin","candidat"].map(r=>`<option ${f&&f.r===r?"selected":""}>${r}</option>`).join("")}</select></div><div><label>Groupe (stagiaire)</label><select id="ug"><option value="">—</option>${DB.grp.map(g=>`<option value="${g.id}" ${f&&f.g===g.id?"selected":""}>${E(g.n)}</option>`).join("")}</select></div></div><button class="p" onclick="saveU()">Enregistrer</button> ${f?'<button onclick="S.uf=null;render()">Annuler</button>':""}<p class="mu">Mot de passe initial : demo</p></div><div class="card">${U.map(x=>`<div class="row"><span><b>${E(x.n)}</b><br><span class="mu">${E(x.e)}${x.r==="formateur"?" · "+DB.sea.filter(s=>s.f===x.id).length+" séance(s)":""}${x.r==="stagiaire"?" · "+gn(x.g):""}</span></span><span><span class="tag">${x.r}</span> <span class="tag ${x.a?"t-ok":"t-er"}">${x.a?"Actif":"Désactivé"}</span> ${x.r==="formateur"&&!x.v?`<button class="ok" onclick="U.find(u=>u.id===${x.id}).v=1;toast('Formateur validé');render()">Valider</button> `:""}<button onclick="S.uf=U.find(u=>u.id===${x.id});render()">Modifier</button> <button ${x===S.u?"disabled":""} onclick="U.find(u=>u.id===${x.id}).a^=1;render()">${x.a?"Désactiver":"Activer"}</button> ${S.dl===x.id?`<button class="er" onclick="delU(${x.id})">Confirmer</button> <button onclick="S.dl=null;render()">Non</button>`:`<button class="er" ${x===S.u?"disabled":""} onclick="S.dl=${x.id};render()">Supprimer</button>`}</span></div>`).join("")}</div>`},
notifs:()=>S.u.r==="admin"?nAdmin():nUser(),
groupes:()=>{const e=S.ge;return `<h2>Groupes</h2><div class="card"><button class="p" onclick="newG()">+ Nouveau groupe</button></div>`+(e?`<div class="card"><h3>${e.id==null?"Nouveau groupe":"Modifier le groupe"}</h3><div class="grid"><div><label>Nom du groupe</label><input id="gpn" value="${E(e.n)}"></div><div><label>Filière</label><select id="gpf">${FIL.map(f=>`<option value="${f.id}" ${e.f===f.id?"selected":""}>${E(f.n)}</option>`).join("")}</select></div><div><label>Année</label><input id="gpa" value="${E(e.an)}"></div></div><button class="p" onclick="saveG()">Enregistrer</button> <button onclick="S.ge=null;render()">Annuler</button></div>`:"")+`<div class="card">${DB.grp.map(g=>`<div class="row"><span><b>${E(g.n)}</b><br><span class="mu">${fn(g.f)} · ${E(g.an)} · ${stag(g.id).length} stagiaire(s) · ${DB.sea.filter(s=>s.g===g.id).length} séance(s)</span></span><span><button onclick="S.pg=${g.id};go('planning')">Emploi du temps</button> <button onclick="S.ge={...DB.grp.find(x=>x.id===${g.id})};render()">Modifier</button> ${S.dl==="g"+g.id?`<button class="er" onclick="delG(${g.id})">Confirmer</button> <button onclick="S.dl=null;render()">Non</button>`:`<button class="er" onclick="S.dl='g${g.id}';render()">Supprimer</button>`}</span></div>`).join("")||'<p class="mu">Aucun groupe.</p>'}</div>`},
abs:()=>{const a=DB.appel;return `<h2>Absences et discipline</h2>`+(a?`<div class="card"><h3>${a.open?"🔴 Appel en cours":"Dernier appel"} · ${E(a.lbl)}</h3>${stag(a.g).map(x=>{const ok=a.sc.includes(x.id);return `<div class="row"><span>${E(x.n)}</span><span class="tag ${ok?"t-ok":a.open?"t-wa":"t-er"}">${ok?(a.open?"A marqué":"Présent"):a.open?"N’a pas encore marqué":"Absent"}</span></div>`}).join("")}${a.open?'<br><button onclick="render()">Actualiser</button>':""}</div>`:'<div class="card mu">Aucun appel lancé pour le moment.</div>')+`<div class="card"><label>Filtrer par groupe</label><select onchange="S.ag=this.value===''?null:+this.value;render()"><option value="">Tous les groupes</option>${DB.grp.map(g=>`<option value="${g.id}" ${S.ag===g.id?"selected":""}>${E(g.n)}</option>`).join("")}</select></div><div class="wrap"><table><tr><th>Stagiaire</th><th>Groupe</th><th>Séances</th><th>Journées</th><th>Note abs.</th><th>Sanction</th><th>Indisc.</th><th>Note indisc.</th><th></th></tr>${stag(S.ag).map(x=>{const d=disc(x.id),i=ind(x.id);return `<tr><td>${E(x.n)}</td><td>${gn(x.g)}</td><td>${d.n}</td><td>${d.j}</td><td>${d.note}/10</td><td>${d.l.length?`<span class="tag t-er">${d.l[d.l.length-1]}</span>`:"—"}</td><td>${i.n}</td><td>${i.note}/10</td><td><button onclick="addI(${x.id},1)">+ Indiscipline</button> <button onclick="addI(${x.id},-1)">−</button></td></tr>`}).join("")}</table></div>`},
gfil:()=>{const e=S.fe;return `<h2>Filières</h2><div class="card"><button class="p" onclick="newF()">+ Nouvelle filière</button></div>`+(e?`<div class="card"><h3>${e.id==null?"Nouvelle filière":"Modifier la filière"}</h3><div class="grid"><div><label>Nom</label><input id="ffn" value="${E(e.n)}"></div><div><label>Niveau</label><select id="ffl">${LV.map(l=>`<option ${e.lv===l?"selected":""}>${l}</option>`).join("")}</select></div><div><label>Durée</label><input id="ffd" value="${E(e.d)}"></div><div><label>Conditions d’accès</label><input id="fft" value="${E(e.t)}"></div><div><label>Diplôme délivré</label><input id="ffp" value="${E(e.dip)}"></div></div><label>Image de la filière (optionnel, sinon une illustration par défaut est utilisée)</label><input type="file" accept="image/*" onchange="imgF(this)"><label>Présentation</label><textarea id="ffs">${E(e.desc)}</textarea><label>Objectifs</label><textarea id="ffo">${E(e.obj)}</textarea><label>Modules (séparés par des virgules)</label><input id="ffm" value="${E(e.mod.join(", "))}"><label>Débouchés (séparés par des virgules)</label><input id="ffb" value="${E(e.deb.join(", "))}"><button class="p" onclick="saveF()">Enregistrer</button> <button onclick="S.fe=null;render()">Annuler</button></div>`:"")+`<div class="card">${FIL.map(f=>`<div class="row"><span><b>${E(f.n)}</b><br><span class="mu">${f.lv} · ${E(f.d)}</span></span><span><button onclick="voir(${f.id})">Fiche</button> <button onclick="edF(${f.id})">Modifier</button> ${S.dl==="f"+f.id?`<button class="er" onclick="delF(${f.id})">Confirmer</button> <button onclick="S.dl=null;render()">Non</button>`:`<button class="er" onclick="S.dl='f${f.id}';render()">Supprimer</button>`}</span></div>`).join("")||'<p class="mu">Aucune filière.</p>'}</div>`},
fiche:()=>{const f=FIL.find(x=>x.id===S.fp);if(!f)return V.filieres();const li=a=>a.length?a.map(x=>`<span class="tag">${E(x)}</span>`).join(" "):'<span class="mu">—</span>';return `<button onclick="go('${S.back||"filieres"}')">← Retour</button><div class="card fc" style="margin:12px 0">${cover(f,1)}</div><div class="hero"><span class="tag" style="background:rgba(255,255,255,.2)">${f.lv}</span><h2>${E(f.n)}</h2><p>${E(f.desc)||"Présentation à venir."}</p>${S.u?"":`<button class="p" style="background:#fff;color:#0047ab" onclick="S.pf=${f.id};go('inscription')">Postuler à cette filière</button>`}</div><div class="grid"><div class="card"><span class="mu">Durée</span><div><b>${E(f.d)}</b></div></div><div class="card"><span class="mu">Conditions d’accès</span><div><b>${E(f.t)||"—"}</b></div></div><div class="card"><span class="mu">Diplôme</span><div><b>${E(f.dip)||"—"}</b></div></div></div><div class="card"><h3>Objectifs</h3><p>${E(f.obj)||"—"}</p></div><div class="card"><h3>Modules</h3>${li(f.mod)}</div><div class="card"><h3>Débouchés</h3>${li(f.deb)}</div>${S.u&&S.u.r==="admin"?`<button class="p" onclick="go('gfil');edF(${f.id})">Modifier la fiche</button>`:""}`},
cands:()=>`<h2>Candidatures</h2><div class="card">${DB.cand.map((c,i)=>`<div class="row"><span><b>${E(c.n)}</b> · ${c.id}<br><span class="mu">${fn(c.f)}${c.na?" · "+E(c.na):""}</span>${c.info?dossier(c):""}</span><span><span class="tag ${tg(c.s)}">${c.s}</span> ${c.s==="En attente"?`<button class="ok" onclick="decide(${i},'Acceptée')">Accepter</button> <button class="er" onclick="decide(${i},'Refusée')">Refuser</button>`:""}</span></div>`).join("")}</div>`};
function qrInit(){const a=DB.appel;if(!a||!a.open||a.g!==S.u.g||a.sc.includes(S.u.id))return;const el=$("qr");if(!S.qe)S.qe=Date.now()+10000;
const draw=()=>{const l=Math.ceil((S.qe-Date.now())/1000);$("cd").textContent=l>0?l+" s":"expiré";if(l<=0){clearInterval(QT);el.innerHTML="<span>Code expiré</span>";$("rn").style.display="inline-block";$("sc").disabled=true}};
try{new QRCode(el,{text:"ECOLE|"+a.sea+"|"+S.u.id+"|"+S.qe,width:170,height:170})}catch(e){el.textContent="[QR]"}
draw();QT=setInterval(draw,400)}
function scan(){if(Date.now()>S.qe){toast("Code expiré");return}DB.appel.sc.push(S.u.id);S.qe=null;toast("Présence enregistrée ✅");render()}
function openAppel(){const s=DB.sea.find(x=>x.id==$("as").value);DB.appel={sea:s.id,mat:s.mat,g:s.g,lbl:JOURS[s.j]+" "+HEURES[s.s]+" · "+s.mat+" ("+gn(s.g)+")",h:HEURES[s.s],fm:S.u.n,date:TODAY,open:1,sc:[]};toast("Appel ouvert : la rubrique est activée chez les stagiaires");render()}
function clore(){const a=DB.appel;let k=0;stag(a.g).forEach(x=>{if(!a.sc.includes(x.id)){DB.abs.push({u:x.id,d:a.date,mat:a.mat,j:0});k++;
const dj=fdl(a.date),sub="Absence signalée : "+a.mat+" – "+dj,body="Bonjour "+x.n+",\n\nVous avez été marqué(e) absent(e) le "+dj+", à la séance de "+a.mat+" ("+a.h+", groupe "+gn(a.g)+", formateur : "+a.fm+").\n\nSi vous avez un justificatif, déposez une demande d’autorisation d’absence sur la plateforme.\n\nMESLOUHI School";
DB.mail.unshift({to:x.e,sub,body,at:new Date().toLocaleString("fr-FR")});DB.notif.unshift({id:nid++,cat:"Absence",title:sub,body:"Séance de "+a.mat+" ("+a.h+"). Un email vous a été envoyé à "+x.e+".",d:a.date,a:{r:"stagiaire",u:x.id}})}});a.open=0;toast(k+" absence(s) enregistrée(s), "+k+" email(s) envoyé(s)");render()}
function trait(id,s){const d=DB.dem.find(x=>x.id===id);d.s=s;DB.notif.unshift({id:nid++,cat:"Stagiaire",title:d.t+" : "+s.toLowerCase(),body:"Votre demande a été traitée.",d:TODAY,a:{r:"stagiaire",u:d.u}});if(s==="Approuvée"&&d.dt)DB.abs.forEach(a=>{if(a.u===d.u&&a.d===d.dt)a.j=1});toast("Demande "+s.toLowerCase());render()}
function demander(){const t=$("dt").value,m=$("dm").value.trim(),dt=$("dd").value;if(!m||(t.startsWith("Aut")&&!dt)){toast("Motif et jour exact requis");return}DB.dem.push({id:nid++,u:S.u.id,t,m,dt:t.startsWith("Aut")?dt:"",s:"En attente"});toast("Demande envoyée");render()}
function edS(id){S.ed={...DB.sea.find(s=>s.id===id)};render()}
function newS(j,s){S.ed={id:0,j,s,mat:"",sa:"",g:S.pg,f:0};render()}
function saveS(){const e=S.ed,n={id:e.id||nid++,j:+$("sj").value,s:+$("ss").value,mat:$("sm").value.trim(),sa:$("sa").value.trim(),g:S.pg,f:+$("sf").value};if(!n.mat||!n.sa){toast("Matière et salle requises");return}
const c=DB.sea.find(x=>x.id!==n.id&&x.j===n.j&&x.s===n.s&&(x.g===n.g||x.sa===n.sa||(n.f&&x.f===n.f)));if(c){toast("Conflit : groupe, salle ou formateur déjà pris sur ce créneau");return}
const i=DB.sea.findIndex(x=>x.id===n.id);if(i<0)DB.sea.push(n);else DB.sea[i]=n;S.ed=null;toast("Séance enregistrée");render()}
function delS(){DB.sea=DB.sea.filter(s=>s.id!==S.ed.id);S.ed=null;toast("Séance supprimée");render()}
function saveU(){const n=$("un").value.trim(),e=$("ue").value.trim(),r=$("ur").value,f=S.uf;if(!n||!e){toast("Nom et identifiant requis");return}if(U.some(x=>x.e===e&&(!f||x.id!==f.id))){toast("Email déjà utilisé");return}
const g=$("ug").value===""?null:+$("ug").value;if(f&&f.id){Object.assign(f,{n,e,r,g})}else U.push({id:nid++,n,e,r,a:1,v:1,g});S.uf=null;toast("Utilisateur enregistré");render()}
function delU(id){U=U.filter(x=>x.id!==id);DB.sea.forEach(s=>{if(s.f===id)s.f=0});DB.abs=DB.abs.filter(a=>a.u!==id);S.dl=null;toast("Utilisateur supprimé");render()}
function addI(u,d){DB.ind[u]=Math.max(0,Math.min(5,(DB.ind[u]||0)+d));render()}
function newG(){S.ge={id:null,n:"",f:FIL.length?FIL[0].id:0,an:"1ère année"};render()}
function saveG(){const e=S.ge,n={id:e.id==null?nid++:e.id,n:$("gpn").value.trim(),f:+$("gpf").value,an:$("gpa").value.trim()};if(!n.n){toast("Nom du groupe requis");return}if(DB.grp.some(g=>g.n===n.n&&g.id!==n.id)){toast("Ce nom existe déjà");return}const i=DB.grp.findIndex(g=>g.id===n.id);if(i<0)DB.grp.push(n);else DB.grp[i]=n;S.ge=null;toast("Groupe enregistré");render()}
function delG(id){DB.grp=DB.grp.filter(g=>g.id!==id);DB.sea=DB.sea.filter(s=>s.g!==id);U.forEach(x=>{if(x.g===id)x.g=null});S.dl=null;toast("Groupe supprimé (ses séances aussi, ses stagiaires n’ont plus de groupe)");render()}
function nUser(){const u=S.u,L=mine(u),rd=DB.read[u.id]||[];
const h="<h2>Notifications</h2>"+(L.length?L.map(n=>{const nw=!rd.includes(n.id);return `<div class="card" style="${nw?"border-left:4px solid var(--ac)":""}"><div class="row" style="border:0;padding:0"><span><span class="tag t-${n.cat==="Absence"?"er":n.cat==="Rendez-vous"?"wa":"ok"}">${n.cat}</span> ${nw?'<span class="tag t-er">Nouveau</span>':""}</span><span class="mu">${fd(n.d)}</span></div><h3 style="margin-top:8px">${E(n.title)}</h3><p>${E(n.body)}</p>${n.rdv?`<div class="card" style="background:var(--bg);margin-bottom:8px"><b>📅 ${new Date(n.rdv).toLocaleString("fr-FR",{dateStyle:"full",timeStyle:"short"})}</b></div><b>Pièces du dossier à apporter :</b><ul>${n.pcs.map(p=>`<li>${E(p)}</li>`).join("")}</ul>`:""}</div>`}).join(""):'<div class="card"><p class="mu">Aucune notification.</p></div>');
DB.read[u.id]=[...new Set([...rd,...L.map(n=>n.id)])];return h}
function nAdmin(){const st=U.filter(x=>x.r==="stagiaire");
return `<h2>Notifications et emails</h2><div class="card"><h3>Nouvelle notification</h3><div class="grid"><div><label>Destinataires</label><select id="nt"><option value="stagiaires">Tous les stagiaires</option><option value="filiere">Une filière</option><option value="groupe">Un groupe</option><option value="stagiaire">Un stagiaire</option><option value="formateurs">Les formateurs</option><option value="tous">Tout le monde</option></select></div><div><label>Filière</label><select id="nf">${FIL.map(f=>`<option value="${f.id}">${E(f.n)}</option>`).join("")}</select></div><div><label>Groupe</label><select id="ng">${DB.grp.map(g=>`<option value="${g.id}">${E(g.n)}</option>`).join("")}</select></div><div><label>Stagiaire</label><select id="ns">${st.map(x=>`<option value="${x.id}">${E(x.n)}</option>`).join("")}</select></div><div><label>Catégorie</label><select id="nc">${["Établissement","Filière","Groupe","Formateur","Stagiaire","Avis","Annonce"].map(c=>`<option>${c}</option>`).join("")}</select></div></div><p class="mu">Filière, groupe et stagiaire ne comptent que selon le type de destinataires choisi.</p><label>Titre</label><input id="nti"><label>Message</label><textarea id="nb"></textarea><button class="p" onclick="sendN()">Publier</button></div>
<div class="card"><h3>Rendez-vous candidat</h3><div class="grid"><div><label>Candidat</label><select id="rc">${DB.cand.map((c,i)=>`<option value="${i}">${E(c.n)} · ${c.id}</option>`).join("")}</select></div><div><label>Date et heure</label><input id="rd" type="datetime-local"></div></div><label>Pièces du dossier (séparées par des virgules)</label><textarea id="rp">CIN, Baccalauréat ou dernier diplôme (copie légalisée), Relevé de notes, 4 photos d’identité, Certificat de résidence</textarea><button class="p" onclick="sendRdv()">Envoyer la convocation</button></div>
<div class="card"><h3>Notifications publiées</h3>${DB.notif.map(n=>`<div class="row"><span><span class="tag">${n.cat}</span> <b>${E(n.title)}</b><br><span class="mu">${aud(n.a)} · ${fd(n.d)}</span></span><button class="er" onclick="DB.notif=DB.notif.filter(x=>x.id!==${n.id});render()">Supprimer</button></div>`).join("")||'<p class="mu">Aucune.</p>'}</div>
<div class="card"><h3>✉ Emails envoyés (simulation)</h3>${DB.mail.map(m=>`<details class="row" style="display:block"><summary><b>${E(m.sub)}</b> <span class="mu">→ ${E(m.to)} · ${E(m.at)}</span></summary><pre>${E(m.body)}</pre></details>`).join("")||'<p class="mu">Aucun email pour le moment. Ils partent automatiquement quand un stagiaire est marqué absent.</p>'}</div>`}
function sendN(){const t=$("nt").value,ti=$("nti").value.trim(),b=$("nb").value.trim();if(!ti||!b){toast("Titre et message requis");return}
const a={stagiaires:{r:"stagiaire"},filiere:{r:"stagiaire",f:+$("nf").value},groupe:{r:"stagiaire",g:+$("ng").value},stagiaire:{r:"stagiaire",u:+$("ns").value},formateurs:{r:"formateur"},tous:{r:"all"}}[t];
DB.notif.unshift({id:nid++,cat:$("nc").value,title:ti,body:b,d:TODAY,a});toast("Notification publiée");render()}
function sendRdv(){const c=DB.cand[+$("rc").value],d=$("rd").value;if(!c||!d){toast("Choisissez un candidat et une date");return}const p=$("rp").value.split(",").map(x=>x.trim()).filter(Boolean);
DB.notif.unshift({id:nid++,cat:"Rendez-vous",title:"Rendez-vous – étude de votre dossier",body:"Merci de vous présenter à l’établissement avec les pièces ci-dessous.",d:TODAY,rdv:d,pcs:p,a:{r:"candidat",m:c.mail}});
const dl=new Date(d).toLocaleString("fr-FR",{dateStyle:"full",timeStyle:"short"});DB.mail.unshift({to:c.mail,sub:"Convocation – "+dl,body:"Bonjour "+c.n+",\n\nVotre rendez-vous est fixé le "+dl+".\nPièces à apporter : "+p.join(", ")+".\n\nMESLOUHI School",at:new Date().toLocaleString("fr-FR")});toast("Convocation envoyée (notification + email)");render()}
function voir(id){S.fp=id;S.back=S.v;S.v="fiche";render()}
function newF(){S.fe={id:null,n:"",lv:LV[0],d:"",t:"",dip:"",desc:"",obj:"",mod:[],deb:[]};render()}
function edF(id){S.fe={...FIL.find(x=>x.id===id)};render()}
function saveF(){const g=i=>$(i).value.trim(),l=i=>g(i).split(",").map(x=>x.trim()).filter(Boolean),e=S.fe,n={id:e.id==null?nid++:e.id,n:g("ffn"),lv:g("ffl"),d:g("ffd"),t:g("fft"),dip:g("ffp"),desc:g("ffs"),obj:g("ffo"),mod:l("ffm"),deb:l("ffb"),img:e.img};if(!n.n||!n.d){toast("Nom et durée requis");return}const i=FIL.findIndex(x=>x.id===n.id);if(i<0)FIL.push(n);else FIL[i]=n;S.fe=null;toast("Filière enregistrée");render()}
function delF(id){FIL=FIL.filter(x=>x.id!==id);S.dl=null;toast("Filière supprimée");render()}
function imgF(el){const f=el.files[0];if(!f)return;if(f.size>1500000){toast("Image trop lourde (1,5 Mo maximum)");el.value="";return}const r=new FileReader();r.onload=()=>{S.fe.img=r.result;toast("Image chargée, pensez à enregistrer")};r.readAsDataURL(f)}
function dossier(c){const i=c.info,r=(l,v)=>`<div class="row" style="padding:4px 0"><span class="mu">${l}</span><span>${E(v)||"—"}</span></div>`;return `<details style="margin-top:6px"><summary class="mu" style="cursor:pointer">Voir le dossier</summary><div style="margin-top:6px">${r("Nom et prénom (FR)",i.nom+" "+i.pre)}${r("الاسم (AR)",i.nar+" "+i.par)}${r("Sexe",i.sx)}${r("Né(e) le",i.dn?fdl(i.dn):"")}${r("Lieu de naissance",i.ln)}${r("CIN",i.cin)}${r("Niveau scolaire",i.nv)}${r("Dernier diplôme",i.dp)}${r("Ville",i.vl)}${r("Adresse",i.ad)}${r("Téléphone",i.tl)}${r("Email",i.e)}${r("Tél. du tuteur",i.tt)}</div></details>`}
function inscrire(){const g=i=>$(i).value.trim(),v={nom:g("ifn"),pre:g("ifp"),nar:g("ian"),par:g("iap"),sx:g("isx"),dn:g("idn"),ln:g("iln"),cin:g("icin"),nv:g("inv"),dp:g("idp"),vl:g("ivl"),ad:g("iad"),tl:g("itl").replace(/[\s.-]/g,""),tt:g("itt"),e:g("ie")};
if(!v.nom||!v.pre||!v.nar||!v.par||!v.dn||!v.vl||!v.tl||!v.e){toast("Merci de remplir tous les champs obligatoires (*)");return}
const ar=/[\u0600-\u06FF]/;if(!ar.test(v.nar)||!ar.test(v.par)){toast("Le nom et le prénom en arabe doivent être saisis en caractères arabes");return}
if(!/^(\+212|0)[5-7]\d{8}$/.test(v.tl)){toast("Numéro de téléphone invalide (ex. 06 12 34 56 78)");return}
if(!/.+@.+\..+/.test(v.e)){toast("Adresse email invalide");return}
const age=(new Date(TODAY)-new Date(v.dn))/31557600000;if(!(age>=14&&age<=60)){toast("Date de naissance incorrecte");return}
if(U.some(x=>x.e.toLowerCase()===v.e.toLowerCase())){toast("Un compte existe déjà, connectez-vous");return}
const id="C-2026-"+String(DB.cand.length+10).padStart(3,"0"),n=v.pre+" "+v.nom.toUpperCase();
DB.cand.push({id,n,na:v.par+" "+v.nar,mail:v.e,f:+$("if").value,s:"En attente",info:v});U.push({id:nid++,n,e:v.e,r:"candidat",a:1,v:1});
DB.mail.unshift({to:v.e,sub:"Confirmation de votre candidature "+id,body:"Bonjour "+n+",\n\nVotre candidature a bien été enregistrée (dossier "+id+"). Vous recevrez une convocation avec la date de rendez-vous.\n\nMESLOUHI School",at:new Date().toLocaleString("fr-FR")});S.done=[id,v.e];render()}
function decide(i,s){const c=DB.cand[i];c.s=s;let gr=null;DB.notif.unshift({id:nid++,cat:"Candidature",title:"Votre candidature a été "+(s==="Acceptée"?"acceptée":"refusée"),body:s==="Acceptée"?"Félicitations ! Votre compte devient un compte stagiaire.":"Votre dossier n’a pas été retenu cette fois.",d:TODAY,a:{r:"all",m:c.mail}});if(s==="Acceptée"){const x=U.find(u=>u.e===c.mail);gr=DB.grp.find(g=>g.f===c.f);const g=gr?gr.id:null;if(x){x.r="stagiaire";x.g=g}else U.push({id:nid++,n:c.n,e:c.mail,r:"stagiaire",a:1,v:1,g})}toast(s==="Acceptée"?"Acceptée : compte converti en stagiaire, "+(gr?"groupe "+gr.n:"à affecter à un groupe"):"Candidature refusée");render()}
render();
</script></body></html>
